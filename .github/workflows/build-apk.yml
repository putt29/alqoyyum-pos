name: Build APK AL-QOYYUM Kasir

# Cara pakai: unggah repo ini ke GitHub -> tab Actions -> "Build APK AL-QOYYUM Kasir" -> Run workflow
# -> isi alamat server backend -> unduh APK dari bagian "Artifacts" setelah selesai.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Alamat server backend (mis. http://192.168.1.10:8000 atau https://kasir.contoh.com)"
        required: true
        default: "http://192.168.1.10:8000"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Membuat file Gradle/MainActivity sesuai versi Flutter yang terpasang.
      # File proyek yang sudah ada (manifest, ikon, tema splash) TIDAK ditimpa.
      - name: Buat scaffold Android
        run: flutter create --platforms=android --org id.alqoyyum --project-name alqoyyum_pos .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Unit test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: alqoyyum-kasir-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
